name: Public README freshness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check README version, specialists, and change-set update
        env:
          README_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_readme.py --base-env README_BASE
